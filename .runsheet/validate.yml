# What runsheet/platform-handbook declares as its validation (ADR 032;
# runsheet's platform/validatespec and mesh-cli's internal/validate read
# it). GitHub Actions is off for the org, so this, run by a Mesh node, is
# the check a pull request must pass before a code owner merges it.
#
# One small lane: scripts/check-skills (skills' frontmatter, likely
# secrets, URL hosts against scripts/allowed-hosts.txt, files outside the
# handbook's folders) and its own test. python3 standard library only:
# the node's image (ghcr.io/runsheet/mesh-node) has python3 and nothing
# else is installed. No paths: every change runs it, it takes seconds.
budget: 5m
suites:
  - name: check-skills
    kind: lint
    # the least room a lane may ask for (cpus must be positive); the
    # check reads text files and needs no more.
    cpus: 0.5
    memory: 256m
    command: python3 scripts/check_skills_test.py && python3 scripts/check-skills .
